<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">画面構成イメージ</title>
  <desc id="desc">上部に操作ボタン、左にカメラ、中央にPDFと輪郭、右に編集パネルを配置した模式図</desc>
  <style>
    text { font-family: "Meiryo", "Yu Gothic", sans-serif; fill: #21312d; }
    .heading { font-size: 24px; font-weight: bold; }
    .label { font-size: 20px; font-weight: bold; }
    .small { font-size: 18px; }
    .button { fill: #fff; stroke: #b6c6bd; stroke-width: 2; }
    .panel { fill: #fff; stroke: #d6dfda; stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="1198" height="478" rx="8" fill="#f3f6f5" stroke="#b6c6bd" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="62" rx="8" fill="#fff"/>
  <text x="20" y="41" class="heading" fill="#214b3a">AI自動投影</text>
  <g transform="translate(210 13)">
    <rect class="button" width="134" height="38" rx="4"/><text x="67" y="26" text-anchor="middle" class="small">PDFを開く</text>
    <rect x="146" width="84" height="38" rx="4" fill="#2c5f4a"/><text x="188" y="26" text-anchor="middle" class="small" style="fill:#fff">撮影</text>
    <rect class="button" x="242" width="84" height="38" rx="4"/><text x="284" y="26" text-anchor="middle" class="small">保存</text>
    <rect class="button" x="338" width="110" height="38" rx="4"/><text x="393" y="26" text-anchor="middle" class="small">読み込み</text>
  </g>
  <rect class="panel" x="12" y="74" width="279" height="393" rx="4"/>
  <rect class="panel" x="301" y="74" width="574" height="393" rx="4"/>
  <rect class="panel" x="885" y="74" width="303" height="393" rx="4"/>
  <circle cx="37" cy="99" r="15" fill="#214b3a"/><text x="37" y="106" text-anchor="middle" class="small" style="fill:#fff;font-weight:bold">1</text>
  <text x="62" y="107" class="label">カメラ</text>
  <circle cx="326" cy="99" r="15" fill="#214b3a"/><text x="326" y="106" text-anchor="middle" class="small" style="fill:#fff;font-weight:bold">2</text>
  <text x="351" y="107" class="label">PDF・輪郭オーバーレイ</text>
  <circle cx="910" cy="99" r="15" fill="#214b3a"/><text x="910" y="106" text-anchor="middle" class="small" style="fill:#fff;font-weight:bold">3</text>
  <text x="935" y="107" class="label">編集パネル</text>
  <rect x="30" y="122" width="243" height="214" rx="3" fill="#26332e"/>
  <path d="M92 162 H122 V220 H181 V162 H211 V289 H92 Z" fill="#aebbb4" stroke="#d7e1db" stroke-width="3"/>
  <rect class="button" x="30" y="348" width="130" height="34" rx="4"/><text x="95" y="372" text-anchor="middle" class="small">画像を開く</text>
  <text x="30" y="412" class="small">セグメンテーション</text>
  <rect x="30" y="423" width="145" height="30" rx="4" fill="#2c5f4a"/><text x="102" y="445" text-anchor="middle" class="small" style="fill:#fff">マスクを確定</text>
  <rect x="315" y="121" width="546" height="330" fill="#e6e9eb"/>
  <rect x="420" y="135" width="335" height="302" fill="#fff" stroke="#c6ceca" stroke-width="2"/>
  <path d="M470 323 V208 H535 V265 H641 V208 H706 V323 Z" fill="none" stroke="#21312d" stroke-width="3"/>
  <path d="M478 315 V202 H543 V259 H649 V202 H714 V315 Z" fill="none" stroke="#c34a17" stroke-width="5"/>
  <text x="905" y="151" class="label">サンプル一覧</text>
  <rect x="905" y="169" width="264" height="45" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="918" y="198" class="small">サンプル 1</text>
  <text x="905" y="250" class="label">配置</text>
  <line x1="905" y1="268" x2="1168" y2="268" stroke="#d6dfda" stroke-width="2"/>
  <text x="905" y="302" class="label">輪郭線の設定</text>
  <circle cx="918" cy="335" r="11" fill="#c34a17"/>
  <text x="944" y="342" class="small">線の色・線種・太さ</text>
  <line x1="905" y1="367" x2="1168" y2="367" stroke="#d6dfda" stroke-width="2"/>
  <text x="905" y="400" class="label">オーバーレイ設定</text>
  <text x="905" y="434" class="small">倍率</text>
</svg>
